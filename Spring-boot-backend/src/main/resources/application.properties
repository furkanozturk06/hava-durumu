spring.application.name=Hava_Durumu
spring.jackson.time-zone=Europe/Istanbul

# OpenWeatherMap API anahtari ortam degiskeninden okunur.
# OPENWEATHER_API_KEY tanimli degilse uygulama baslamaz (sessiz fallback yok).
openweather.api-key=${OPENWEATHER_API_KEY}

# CORS izin verilen originler (virgulle ayrilmis). Dev varsayilani localhost.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174}
